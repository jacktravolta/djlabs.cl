    /* Contact section: self-contained styles. The landing's inlined Tailwind
       build has no form utilities, so this block owns every control look. */
    #contacto{border-top:1px solid var(--line);background:rgba(15,15,15,.4);position:relative}
    #contacto .dj-wrap{max-width:1280px;margin:0 auto;padding:80px 24px}

    #contacto .dj-dot{width:5px;height:5px;border-radius:9999px;background:#00FF88;flex:none}

    #contacto .dj-field{display:flex;flex-direction:column;gap:8px;min-width:0}
    #contacto .dj-field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6B6A66}
    #contacto .dj-field input,#contacto .dj-field textarea{width:100%;box-sizing:border-box;background:#121212;border:1px solid var(--line);border-radius:12px;padding:13px 16px;color:#F8F6F0;font:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s}
    #contacto .dj-field textarea{min-height:150px;resize:vertical;line-height:1.6}
    #contacto .dj-field input::placeholder,#contacto .dj-field textarea::placeholder{color:#3A3A38}
    #contacto .dj-field input:focus,#contacto .dj-field textarea:focus{outline:none;border-color:rgba(0,255,136,.55);box-shadow:0 0 0 3px rgba(0,255,136,.12)}
    #contacto .dj-bad{border-color:rgba(255,138,101,.65)!important}

    #contacto .dj-actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px}

    /* Menu burger (mobile). El nav del header es "hidden md:flex", asi que en
       pantallas chicas los indices desaparecian sin ninguna alternativa.
       Breakpoint md = 768px, el mismo que usa el Tailwind compilado. */
    #dj-burger{
      width:36px;height:36px;flex:0 0 auto;padding:0;border-radius:9999px;
      border:1px solid var(--line-strong);
      display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;

      -webkit-tap-highlight-color:transparent;

      color:#F8F6F0;border-color:rgba(248,246,240,.28);outline:none;
    }
    #dj-burger span{
      display:block;width:16px;height:1.5px;border-radius:2px;background:currentColor;
      transition:transform .25s ease,opacity .18s ease;
    }
    #dj-burger[aria-expanded="true"] span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
    #dj-burger[aria-expanded="true"] span:nth-child(2){opacity:0;transform:scaleX(.4)}
    #dj-burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}

    /* Panel: emerge desde debajo del header (z 110) hacia el z 109. */
    #dj-menu{
      position:fixed;left:0;right:0;top:0;z-index:109;
      background:rgba(10,10,10,.97);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);

      padding-top:calc(env(safe-area-inset-top,0px) + 72px);
      transform:translateY(-100%);visibility:hidden;
      transition:transform .28s cubic-bezier(.4,0,.2,1),visibility .28s;
      max-height:100vh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;
    }
    #dj-menu.dj-open{transform:translateY(0);visibility:visible}
    #dj-menu-backdrop{
      position:fixed;inset:0;z-index:108;background:rgba(0,0,0,.55);

      #dj-menu,#dj-menu-backdrop,#dj-burger span{transition:none !important}
    }
